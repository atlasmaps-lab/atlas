# Atlas 0.8: refresh the written context beside the numbers (data/context.js) every morning from official sources.
name: Context feed
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/fetch_context.py
      - name: Commit if changed
        run: |
          git config user.name "atlas-context-bot"
          git config user.email "atlas-context-bot@users.noreply.github.com"
          git add data/context.js
          if ! git diff --cached --quiet; then
            git commit -m "Context feed: $(date -u +%F)"
            git pull --rebase
            git push
          fi
